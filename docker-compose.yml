version: '3.8'

services:
  web:
    image: nginx:alpine
    container_name: securebox-site
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./html:/usr/share/nginx/html
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./ssl:/etc/nginx/ssl
    networks:
      - securebox-network

networks:
  securebox-network:
    driver: bridge