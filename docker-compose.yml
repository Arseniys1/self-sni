version: '3.8'

services:
  web:
    image: nginx:alpine
    container_name: securebox-site
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - "${SITE_DIR:-./sites/secure-box}:/usr/share/nginx/html"
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./ssl:/etc/nginx/ssl
    networks:
      - securebox-network
    environment:
      - SITE_DIR=${SITE_DIR:-./sites/secure-box}

networks:
  securebox-network:
    driver: bridge